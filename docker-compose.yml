services:

  # =========================================================
  # HADOOP HDFS - NAMENODE
  # =========================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: travelglobe-namenode
    hostname: namenode
    restart: unless-stopped

    ports:
      - "9870:9870"
      - "9000:9000"

    volumes:
      - hadoop_namenode:/hadoop/dfs/name

    environment:
      CLUSTER_NAME: travelglobe

    env_file:
      - ./backend/hadoop.env

    networks:
      - travelglobe


  # =========================================================
  # HADOOP HDFS - DATANODE
  # =========================================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: travelglobe-datanode
    hostname: datanode
    restart: unless-stopped

    ports:
      - "9864:9864"

    volumes:
      - hadoop_datanode:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: namenode:9870

    env_file:
      - ./backend/hadoop.env

    depends_on:
      - namenode

    networks:
      - travelglobe


  # =========================================================
  # HDFS INITIALIZATION
  # =========================================================
  hdfs-init:
    image: bde2020/hadoop-base:2.0.0-hadoop3.2.1-java8
    container_name: travelglobe-hdfs-init
    restart: on-failure

    env_file:
      - ./backend/hadoop.env

    volumes:
      - ./backend/jobs/seed:/seed:ro
      - ./backend/jobs/hdfs-init.sh:/init.sh:ro

    depends_on:
      - namenode
      - datanode

    entrypoint:
      - bash
      - /init.sh

    networks:
      - travelglobe


  # =========================================================
  # HADOOP MAPREDUCE
  # =========================================================
  mapreduce:
    build:
      context: ./backend/jobs/mapreduce

    container_name: travelglobe-mapreduce
    hostname: mapreduce
    restart: unless-stopped

    env_file:
      - ./backend/hadoop.env

    environment:
      SERVICE_PRECONDITION: namenode:9870

    volumes:
      - ./backend/jobs/mapreduce:/jobs:ro

    command:
      - bash
      - /jobs/run_loop.sh

    depends_on:
      - namenode
      - datanode
      - hdfs-init

    networks:
      - travelglobe


  # =========================================================
  # APACHE KAFKA
  # =========================================================
  kafka:
    image: apache/kafka:latest
    container_name: travelglobe-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - travelglobe


  # =========================================================
  # APACHE SPARK - MASTER
  # =========================================================
  spark-master:
    image: apache/spark:3.5.1
    container_name: travelglobe-spark-master
    hostname: spark-master
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master

    environment:
      SPARK_NO_DAEMONIZE: "true"

      HADOOP_CONF_DIR: /opt/spark/conf/hadoop

    volumes:
      - ./backend/jobs/spark/hadoop-conf:/opt/spark/conf/hadoop:ro

    ports:
      - "8080:8080"
      - "7077:7077"

    networks:
      - travelglobe


  # =========================================================
  # APACHE SPARK - WORKER
  # =========================================================
  spark-worker:
    image: apache/spark:3.5.1
    container_name: travelglobe-spark-worker
    hostname: spark-worker
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_NO_DAEMONIZE: "true"

      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1

      HADOOP_CONF_DIR: /opt/spark/conf/hadoop

    volumes:
      - ./backend/jobs/spark/hadoop-conf:/opt/spark/conf/hadoop:ro

    depends_on:
      - spark-master

    networks:
      - travelglobe


  # =========================================================
  # SPARK JOBS
  # PageRank + Analytics
  # =========================================================
  spark-jobs:
    build:
      context: ./backend/jobs/spark

    container_name: travelglobe-spark-jobs
    hostname: spark-jobs
    restart: unless-stopped

    user: root

    environment:
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop

    volumes:
      # Mount the job scripts so the running container always has the latest
      # Python files even without a rebuild. run_loop.sh is also mounted here
      # and takes precedence over the image copy at /opt/spark/run_loop.sh.
      - ./backend/jobs/spark:/jobs:ro
      - ./backend/jobs/spark/hadoop-conf:/opt/spark/conf/hadoop:ro

    depends_on:
      - spark-master
      - spark-worker
      - namenode
      - datanode
      - hdfs-init

    networks:
      - travelglobe


  # =========================================================
  # TRAVELGLOBE BACKEND
  # =========================================================
  backend:
    build:
      context: ./backend

    container_name: travelglobe-backend
    hostname: backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - path: ./backend/.env
        required: false

    environment:
      HDFS_WEBHDFS: http://namenode:9870
      KAFKA_BOOTSTRAP: kafka:9092
      SPARK_UI: http://spark-master:8080

    depends_on:
      - namenode
      - datanode
      - kafka
      - spark-master

    networks:
      - travelglobe


  # =========================================================
  # TRAVELGLOBE FRONTEND
  # =========================================================
  frontend:
    build:
      context: ./frontend

    container_name: travelglobe-frontend
    hostname: frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_PROXY_TARGET: http://backend:8000

    depends_on:
      - backend

    networks:
      - travelglobe


# =========================================================
# PERSISTENT VOLUMES
# =========================================================
volumes:
  hadoop_namenode:
  hadoop_datanode:
  kafka_data:


# =========================================================
# NETWORK
# =========================================================
networks:
  travelglobe:
    driver: bridge